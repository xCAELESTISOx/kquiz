# Temporary: checks the server move from outside (the Claude sandbox can't reach the servers).
# Runs only on pushes to the move branch; delete together with deploy/migrate-*.
name: probe-move
on:
  push:
    branches: [claude/project-thread-w09sg1]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          NEW=179.236.41.211
          echo "== receiver on the new server"; curl -sS -m 20 "http://$NEW:8099/status"
          echo; echo "== DNS"; getent hosts kquiz.ru
          echo "== kquiz.ru via DNS"; curl -sS -m 20 -o /dev/null -w '%{http_code} %{remote_ip}\n' https://kquiz.ru/api/health
          echo "== new server directly"; curl -sS -m 20 --resolve "kquiz.ru:443:$NEW" -w ' %{http_code}\n' https://kquiz.ru/api/health
          echo "== old server directly"; curl -sS -m 20 --resolve "kquiz.ru:443:201.24.53.194" -w ' %{http_code}\n' https://kquiz.ru/api/health
          exit 0
