name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  scorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/scorer/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m nltk.downloader cmudict
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh
      - run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - run: deploy/smoke-test.sh

  # Images the server pulls instead of building (deploy/update.sh). Only commits on main that
  # passed every job above get them, so the server never runs a red commit from the registry.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [node, scorer, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, caddy, scorer]
    env:
      IMAGE: ghcr.io/xcaelestisox/kquiz-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The registry cache keeps unchanged layers (torch in the scorer) byte for byte the same,
      # so the server downloads only the layers a commit changed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
