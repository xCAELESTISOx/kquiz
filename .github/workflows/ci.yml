name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  scorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/scorer/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m nltk.downloader cmudict
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh
      - run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - run: deploy/smoke-test.sh
      - name: Scorer image starts and answers /g2p (without the model)
        working-directory: deploy
        env: { DOMAIN: kquiz.test, ORIGIN_SECRET: unused-in-this-step }
        run: |
          docker compose --profile scorer build scorer
          docker compose --profile scorer run -d --name scorer -e SCORER_LOAD_MODEL=0 scorer
          for _ in $(seq 60); do
            curl -fsS 'http://127.0.0.1:8788/g2p?text=%EA%B5%AD%EB%AC%BC' && exit 0
            sleep 2
          done
          docker logs scorer
          exit 1
