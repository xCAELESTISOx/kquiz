# Run from this directory. update.sh pulls the images CI built (KQUIZ_TAG=sha-<commit>);
# docker compose up -d --build builds them here instead.
# All services use the host network and bind only what they must:
# Caddy :80 and :443, API 127.0.0.1:8787, scorer 127.0.0.1:8788.
name: kquiz

x-hardening: &hardening
  network_mode: host
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  api:
    <<: *hardening
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: ${KQUIZ_REGISTRY:-ghcr.io/xcaelestisox}/kquiz-api:${KQUIZ_TAG:-main}
    # Passes SETUP_CODE when deploy/.env sets it.
    env_file: [{ path: .env, required: false }]
    environment:
      ORIGIN: https://${DOMAIN:?set DOMAIN in deploy/.env}
      ORIGIN_SECRET: ${ORIGIN_SECRET:?set ORIGIN_SECRET in deploy/.env}
    volumes:
      - ${KQUIZ_DATA:-/srv/kquiz/data}:/data
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  caddy:
    <<: *hardening
    build: { context: .., dockerfile: deploy/Dockerfile.caddy }
    image: ${KQUIZ_REGISTRY:-ghcr.io/xcaelestisox}/kquiz-caddy:${KQUIZ_TAG:-main}
    cap_add: [NET_BIND_SERVICE]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ORIGIN_SECRET: ${ORIGIN_SECRET:?set ORIGIN_SECRET in deploy/.env}
      CADDY_TLS: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      # Let's Encrypt certificates must survive restarts, or renewals hit rate limits.
      - caddy-data:/data
    tmpfs: [/config]
    mem_limit: 256m
    pids_limit: 100
    depends_on: [api]

  # Pronunciation scoring. Downloads the model (~1.3 GB) into scorer-models on first start;
  # the volume outlives image updates, so the model is downloaded once per server.
  scorer:
    <<: *hardening
    build: { context: .., dockerfile: deploy/Dockerfile.scorer }
    image: ${KQUIZ_REGISTRY:-ghcr.io/xcaelestisox}/kquiz-scorer:${KQUIZ_TAG:-main}
    environment:
      SCORER_THREADS: "2"
      SCORER_LOAD_MODEL: ${SCORER_LOAD_MODEL:-1}
    volumes:
      - scorer-models:/models
    tmpfs: [/tmp]
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 200

volumes:
  caddy-data:
  scorer-models:
